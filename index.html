<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Crux Alpha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: single phone column, one screen at a time, CTA pinned to the bottom of each screen */
:root{
  --bg:#050604; --surface:#10120c; --surface-2:#191c12; --line:#262a1c;
  --fg:#F2F4EC; --muted:#9A9F8C;
  --accent:#DBEF90; --accent-deep:#243100; --on-accent:#141a00; --accent-ink:#DBEF90;
  --unsure:#FF9F43; --unknown:#FF6B6B;
  --glow:rgba(190,224,90,.55);
  --display:"Urbanist", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Urbanist", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F3F4EE; --surface:#FFFFFF; --surface-2:#E9ECDF; --line:#DCE0CF;
  --fg:#0E1008; --muted:#5D6250;
  --accent:#C8E36A; --accent-deep:#3F5600; --on-accent:#141a00; --accent-ink:#4A6600;
  --unsure:#C96A00; --unknown:#D63B3B; --glow:rgba(150,190,40,.45); color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#F3F4EE; --surface:#FFFFFF; --surface-2:#E9ECDF; --line:#DCE0CF;
  --fg:#0E1008; --muted:#5D6250;
  --accent:#C8E36A; --accent-deep:#3F5600; --on-accent:#141a00; --accent-ink:#4A6600;
  --unsure:#C96A00; --unknown:#D63B3B; --glow:rgba(150,190,40,.45); color-scheme:light; }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--accent-ink);outline-offset:3px}

.app{max-width:430px;margin:0 auto;min-height:100%;position:relative;padding-inline:20px;display:flex;flex-direction:column}
.screen{display:flex;flex-direction:column;flex:1;padding-block:20px 120px;gap:20px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.brand{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--accent),var(--accent-deep));box-shadow:0 0 14px var(--glow)}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pill{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.02em}
h1{font-size:40px;line-height:1.05;font-weight:500}
h2{font-size:28px;line-height:1.15;font-weight:500}
p{margin:0}
.lead{color:var(--muted);font-size:17px;max-width:34ch}
.ink{color:var(--accent-ink)}

.cta-wrap{position:fixed;left:0;right:0;bottom:0;padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;justify-content:center;z-index:5}
.cta-inner{width:100%;max-width:390px;display:flex;flex-direction:column;gap:10px}
.btn{width:100%;padding:17px 20px;border-radius:18px;font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:disabled{opacity:.35;cursor:default}
.btn-ghost{background:var(--surface);border:1px solid var(--line)}
.link{color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px}

/* Welcome */
.hero-orb{width:220px;height:220px;margin:24px auto 8px;border-radius:50%;background:radial-gradient(circle at 50% 45%,var(--accent) 0%,rgba(219,239,144,.45) 30%,transparent 68%);filter:blur(2px);animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.94);opacity:.85}50%{transform:scale(1.04);opacity:1}}
.steps-mini{display:grid;gap:10px;margin-top:4px}
.steps-mini div{display:flex;gap:12px;align-items:baseline;color:var(--muted);font-size:15px}
.steps-mini b{font-family:var(--mono);font-weight:500;font-size:12px;color:var(--accent-ink)}

/* Quiz */
.progress{height:4px;background:var(--surface-2);border-radius:4px;overflow:hidden;flex:1}
.progress span{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.back{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;font-size:18px}
.options{display:grid;gap:10px}
.opt{text-align:left;padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:17px;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:12px;transition:border-color .15s,background .15s}
.opt small{display:block;color:var(--muted);font-weight:400;font-size:14px;margin-top:2px}
.opt[aria-pressed="true"]{border-color:var(--accent-ink);background:var(--surface-2)}
.opt .dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);flex:none}
.opt[aria-pressed="true"] .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 12px var(--glow)}

/* Building */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
.build-orb{width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(219,239,144,.45) 0%,transparent 65%);animation:breathe 1.6s ease-in-out infinite;position:absolute}
.build-stage{position:relative;width:220px;height:220px;display:grid;place-items:center}
.morph{width:150px;height:150px;position:relative;overflow:visible;filter:drop-shadow(0 0 18px var(--glow))}
.morph polygon{fill:var(--accent)}
.brand svg{width:16px;height:16px;filter:drop-shadow(0 0 6px var(--glow))}
.brand svg polygon{fill:var(--accent)}
.done-mark{width:64px;height:64px}
.done-mark path,.done-mark circle{fill:none;stroke:var(--accent-ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.build-line{font-size:18px;color:var(--muted);min-height:28px}

/* Reveal */
.count{display:flex;align-items:baseline;gap:10px}
.count .big{font-family:var(--display);font-size:72px;line-height:.9;font-weight:300;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.why{display:grid;gap:10px}
.why div{display:flex;gap:10px;font-size:15px;color:var(--muted)}
.why div::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:9px}
.days{display:grid;gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:10px}
.day-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.day-head strong{font-family:var(--display);font-weight:600;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:5px 10px;border-radius:999px;background:var(--surface-2);color:var(--fg)}
.chip.rv{background:transparent;border:1px dashed var(--accent-ink);color:var(--accent-ink)}

/* Today */
.daytabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.daytabs button{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;color:var(--muted)}
.daytabs button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat.unsure b{color:var(--unsure)}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.row .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:12px;border:1px solid var(--line);flex:none;color:var(--muted)}
.row .t{flex:1;min-width:0}
.row .t strong{display:block;font-weight:600;font-size:16px}
.row .t span{font-size:13px;color:var(--muted)}
.row .go{font-size:13px;font-weight:600;color:var(--accent-ink)}
.row.done{opacity:.55}
.row.done .n{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.row.next{border-color:var(--accent-ink)}
.note{font-size:14px;color:var(--muted);padding:12px 14px;border-radius:14px;background:var(--surface-2)}

/* Session */
.timer-zone{position:relative;display:grid;place-items:center;margin:8px 0}
.s-orb{width:250px;height:250px;max-width:100%;border-radius:50%;background:radial-gradient(circle at 50% 50%,var(--accent) 0%,rgba(219,239,144,.42) 28%,rgba(36,49,0,.25) 55%,transparent 70%);transition:opacity .4s}
.s-orb.running{animation:breathe 4s ease-in-out infinite}
.s-orb.paused{opacity:.45}
.time{position:absolute;font-family:var(--display);font-weight:300;font-size:60px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--fg);text-shadow:0 2px 20px rgba(0,0,0,.35)}
.tbar{height:4px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.tbar span{display:block;height:100%;background:var(--fg);width:0}
.tmeta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted)}
.controls{display:flex;align-items:center;justify-content:center;gap:22px}
.round{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted)}
.play{width:72px;height:72px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center}
.play svg{width:26px;height:26px;fill:currentColor}
.howto{display:grid;gap:10px;counter-reset:s}
.howto li{list-style:none;display:flex;gap:12px;font-size:15px}
.howto li::before{counter-increment:s;content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--accent-ink);margin-top:1px}
.howto{padding:0;margin:0}
.unsure-btn{border:1px solid var(--unsure);color:var(--unsure);background:transparent}
.toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-family:var(--mono)}
.toggle input{accent-color:var(--accent-deep)}

/* Check-in */
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.feel button{padding:22px 8px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-weight:600;display:grid;gap:4px}
.feel button span{font-size:12px;font-weight:400;color:var(--muted)}
.checklist{display:grid;gap:8px}
.checklist label{display:flex;gap:10px;align-items:flex-start;font-size:15px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.checklist input{margin-top:4px;accent-color:var(--accent-deep)}

.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:all .25s;z-index:10;max-width:calc(100% - 40px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.alpha{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--on-accent);background:var(--accent);padding:2px 6px;border-radius:5px}

.opt .dot{transition:transform .2s}
.split-wrap{display:inline-block}
.langbtn{font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:5px 9px;border-radius:8px;border:1px solid var(--line);color:var(--muted)}

/* XP, levels, streak */
.lvl{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.lvl b{color:var(--on-accent);background:var(--accent);border-radius:6px;padding:2px 7px;font-weight:500}
.xpbar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.xpbar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent-deep),var(--accent));border-radius:6px;transition:width .6s}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats3 .stat{padding:12px}
.stats3 .stat b{font-size:26px}
.stat.hot b{color:var(--accent-ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{padding:10px;border-radius:10px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface-2);color:var(--fg)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-h h3{margin:0;font-family:var(--display);font-weight:600;font-size:18px}

/* Pills */
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pillcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;display:grid;gap:6px;min-width:0}
.pillcard .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-family:var(--mono);font-size:11px;color:var(--accent-ink)}
.pillcard strong{font-size:14px;font-weight:600}
.pillcard span{font-size:12px;color:var(--muted)}
.pillcard.done{border-color:var(--accent-ink)}
.pillcard.done .ic{background:var(--accent);color:var(--on-accent)}

/* Topics */
.tdot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.s-red{background:var(--unknown)} .s-orange{background:var(--unsure)} .s-lime{background:var(--accent);box-shadow:0 0 10px var(--glow)}
.topic{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.topic .nm{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.topic .nm small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.cset{display:flex;gap:6px}
.cset button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;display:grid;place-items:center;opacity:.35}
.cset button[aria-pressed="true"]{opacity:1;border-color:var(--fg)}
.cset button i{width:14px;height:14px;border-radius:50%;display:block}
.star{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:16px}
.star[aria-pressed="true"]{color:var(--accent-ink)}
.x{width:26px;height:26px;color:var(--muted);font-size:18px}
.addrow{display:flex;gap:8px}
.field{flex:1;min-width:0;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:16px}
.field:focus{outline:2px solid var(--accent-ink);outline-offset:1px}
.btn-sm{padding:0 18px;border-radius:14px;background:var(--fg);color:var(--bg);font-weight:600}
.ready{display:flex;align-items:baseline;gap:10px}
.ready .big{font-family:var(--display);font-size:56px;font-weight:300;line-height:1;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.stack{display:flex;height:10px;border-radius:10px;overflow:hidden;background:var(--surface-2);gap:2px}
.stack i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.target{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface-2)}
.target select{flex:1;min-width:0;background:transparent;border:0;color:var(--fg);font:inherit;font-weight:600;font-size:16px}

/* Compact timer */
.ctimer{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.ctimer .ct{font-family:var(--display);font-size:28px;font-weight:300;font-variant-numeric:tabular-nums;min-width:84px}
.ctimer .tbar{flex:1}
.mini-play{width:40px;height:40px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;flex:none}
.mini-play svg{width:16px;height:16px;fill:currentColor}

/* Flashcards */
.deck-top{display:flex;justify-content:space-between;align-items:center}
.combo{font-family:var(--mono);font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.combo.on{border-color:var(--accent-ink);color:var(--accent-ink);box-shadow:0 0 16px var(--glow)}
.fcard{min-height:240px;border-radius:24px;background:var(--surface);border:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:16px;justify-content:center}
.fcard .q{font-family:var(--display);font-size:24px;line-height:1.25;font-weight:500;overflow-wrap:anywhere}
.fcard .ans{padding-top:16px;border-top:1px dashed var(--line);font-size:18px;color:var(--accent-ink);overflow-wrap:anywhere}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade button{padding:16px 6px;border-radius:16px;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface)}
.grade .g-miss{color:var(--unknown);border-color:var(--unknown)}
.grade .g-uns{color:var(--unsure);border-color:var(--unsure)}
.grade .g-got{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.mini-list{display:grid;gap:6px}
.mini-list div{font-size:14px;color:var(--muted);padding:8px 12px;border-radius:10px;background:var(--surface);overflow-wrap:anywhere}

/* Assess + reward */
.choices{display:grid;gap:10px}
.choices button{padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left;font-weight:600;font-size:17px;display:flex;align-items:center;gap:12px}
.choices button span{font-weight:400;font-size:14px;color:var(--muted);display:block}
.xp-big{font-family:var(--display);font-size:84px;font-weight:300;line-height:1;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.changes{display:grid;gap:8px}
.change{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:15px}
.change .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.change .arr{display:flex;align-items:center;gap:6px;color:var(--muted);font-family:var(--mono);font-size:12px}
.mastered{position:relative;border-radius:22px;padding:22px;background:radial-gradient(circle at 50% 0%,rgba(219,239,144,.28),transparent 70%),var(--surface);border:1px solid var(--accent-ink);text-align:center;display:grid;gap:8px;justify-items:center;overflow:hidden}
.mastered svg{width:64px;height:64px;filter:drop-shadow(0 0 16px var(--glow))}
.mastered svg polygon{fill:var(--accent)}
.xpf{position:fixed;left:50%;top:22%;transform:translateX(-50%);font-family:var(--display);font-weight:600;font-size:22px;color:var(--accent-ink);pointer-events:none;z-index:20;text-shadow:0 0 16px var(--glow);animation:xpf 1s ease-out forwards}
@keyframes xpf{from{opacity:0;transform:translate(-50%,10px)}20%{opacity:1}to{opacity:0;transform:translate(-50%,-40px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js"></script>
<div class="app" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Language ---------- */
const I18N = {
en: {
  locale:'en-IE',
  quiz:[
    {k:'when', q:'When is your exam?', o:[['1','Tomorrow'],['3','In 2–3 days'],['5','In 4–7 days'],['7','In 1–2 weeks']]},

function buildPlan(a){
  const D = +a.when, per = +a.hours, pool = POOL[a.type];
  const days = []; let di = 0;
  for(let d=0; d<D; d++){
    const list = [];
    const last = d===D-1 && D>1;
    const cap = last ? Math.max(2, per-1) : per;
    if(d===0){ if(a.struggle==='start') list.push('warmup'); list.push('triage'); }
    if(last && (a.grade!=='pass' || D>=3)) list.push(a.type==='essay' ? 'essaymock' : 'mock');
    let alt = 0;
    while(list.length < cap-1){
      const learnPhase = (a.covered==='none' && d < Math.ceil(D/2)) || (a.covered==='half' && d===0);
      if(a.struggle==='forget' && list.length===Math.floor(cap/2) && !list.includes('review')){ list.push('review'); continue; }
      if(learnPhase && alt%2===0 && !last) list.push(pool.learn);
      else { list.push(pool.drill[di % pool.drill.length]); di++; }
      alt++;
    }
    list.push('review');
    days.push(list.map(k => ({key:k, min: k==='triage' && a.struggle==='prioritise' ? 40 : B[k].min})));
  }
  return days;
}

function reasons(a){
  const R0 = L().reasons, r = [R0.type[a.type], R0.covered[a.covered], R0.struggle[a.struggle]];
  if(a.grade==='pass') r.push(R0.pass);
  if(a.grade==='top') r.push(R0.top);
  return r;
}

function pickTopic(pref){
  if(!S.topics.length) return null;
  let c = S.topics.filter(t=>t.status!=='lime'); if(!c.length) c = S.topics;
  if(pref==='orange') c = [...c.filter(t=>t.status==='orange'), ...c.filter(t=>t.status!=='orange')];
  c = pref==='orange' ? c.sort((x,y)=> (x.status==='orange'?0:1)-(y.status==='orange'?0:1) || (y.star?1:0)-(x.star?1:0)) : byPriority(c);
  const used = Object.entries(S.sessTopic).filter(([k])=>k.startsWith(S.day+'-')).map(([,v])=>v);
  return (c.find(t=>!used.includes(t.id)) || c[0]).id;

function readiness(){
  if(!S.topics.length) return 0;
  const l = S.topics.filter(t=>t.status==='lime').length, o = S.topics.filter(t=>t.status==='orange').length;
  return Math.round((l + o*.5)/S.topics.length*100);
}
function applyResult(tid, res){
  const t = topic(tid); if(!t) return;
  const from = t.status; t.hits = t.hits || [];
  if(res==='good'){
    if(from==='red') t.status='orange';
    else if(from==='orange' && t.hits.some(d=>d!==S.day)) t.status='lime';
    if(!t.hits.includes(S.day)) t.hits.push(S.day);
  } else if(res==='partial'){
    if(from==='red') t.status='orange';
  } else {
    t.status = from==='lime' ? 'orange' : 'red'; t.hits = [];
  }
  if(t.status!==from){
    const up = RANK[t.status] > RANK[from];
    R.changes.push({name:t.name, from, to:t.status});
    if(up){ addXP(t.status==='lime' ? 60 : 25); if(t.status==='lime') R.mastered.push(t.name); }
  } else if(res==='good' && from==='orange'){
    R.changes.push({name:t.name, from, to:from, note:tr('againNote')});
  }
  if(res!=='good' && t.status!=='lime') R.gap = tid;
}

/* ---------- XP, streak ---------- */
function addXP(n){
  const before = level();
  S.xp += n; if(R) R.xp += n;
  const f = document.createElement('div'); f.className='xpf'; f.textContent = `+${n} XP`;
  document.body.appendChild(f); setTimeout(()=>f.remove(), 1000);
  if(level() > before){ setTimeout(()=>toast(tr('levelUp',{n:level()})), 400); buzz(40); }
}
function markActive(){ S.active[dkey(new Date())] = 1; }
function streak(){
  let n = 0; const d = new Date();
  while(S.active[dkey(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}

/* ---------- Flashcards ---------- */
function dueCards(){
  const final = S.day === lastDay();
  return S.cards.filter(c => c.due <= S.day || (final && c.box < 4))
    .sort((x,y)=> x.box-y.box || y.miss-x.miss).map(c=>c.id);
}
function weakestCards(n){
  return [...S.cards].sort((x,y)=> x.box-y.box || y.miss-x.miss || x.due-y.due).slice(0,n).map(c=>c.id);
}
function startDeck(ids, ctx, tid){ CR = {ids, i:0, flip:false, combo:0, best:0, ctx, tid, per:{}}; }
function gradeCard(g){
  const c = S.cards.find(x=>x.id===CR.ids[CR.i]); if(!c) return;
  const later = CR.ctx!=='session';
  const p = CR.per[c.tid] = CR.per[c.tid] || {n:0, s:0}; p.n++;
  if(g==='got'){
    c.box = Math.min(4, c.box+1); c.due = Math.min(lastDay(), S.day + INT[c.box]); c.got++; p.s += 1;
    CR.combo++; CR.best = Math.max(CR.best, CR.combo); addXP(10); buzz(8);
    if(CR.combo % 5 === 0){ addXP(15); toast(tr('combo',{n:CR.combo})); buzz(30); }
  } else {
    c.box = 1; c.due = later ? Math.min(lastDay(), S.day+1) : S.day; CR.combo = 0;
    if(g==='uns'){ p.s += .5; addXP(4); } else { c.miss++; addXP(2); }
  }
  R.cards++; R.best = Math.max(R.best, CR.best);
  CR.i++; CR.flip = false;
  if(CR.i >= CR.ids.length) finishDeck(); else { render(); popCard(); }
}
function finishDeck(){
  if(CR.ctx !== 'pill'){
    Object.entries(CR.per).forEach(([tid,p])=>{
      if(CR.ctx==='review' && p.n < 2) return;
      const acc = p.s/p.n; applyResult(tid, acc>=.8 ? 'good' : acc>=.5 ? 'partial' : 'bad');
    });
  }
  if(CR.ctx==='pill') finishPill(); else completeSession(30);
}

/* ---------- Session lifecycle ---------- */
const sKey = () => `${S.day}-${S.cur}`;
const curBlock = () => S.plan[S.day][S.cur];
const curTopicId = () => S.sessTopic[sKey()];
function openSession(i){
  S.cur = i; const b = curBlock(), def = B[b.key];
  R = {xp:0, changes:[], best:0, cards:0, mastered:[], gap:null};
  if(def.topic && !curTopicId()){ const t = pickTopic(def.topic); if(t) S.sessTopic[sKey()] = t; }
  CP = 'make'; CR = null;
  if(def.tool==='review'){ const ids = dueCards(); if(ids.length) startDeck(ids, 'review'); }
  stopT(); T.total = b.min*60; T.left = T.total;
  go('session');
}
function completeSession(base){
  stopT();
  S.done[sKey()] = true; addXP(base); markActive();
  go('reward');
}
function finishPill(){
  S.pills[S.day] = (S.pills[S.day]||0) + 1; addXP(20); markActive();
  go('reward');
}
function startPill(){
  R = {xp:0, changes:[], best:0, cards:0, mastered:[], gap:null, pill:true};
  CR = null;
  if(S.cards.length >= 3) startDeck(weakestCards(5), 'pill');
  go('pill');
}

      <div class="bar"><span class="tag">${tr('selfCheck')} · ${bname(b.key)}</span></div>
      <h2>${tr('markWhat')}</h2>
      <div class="checklist">${L().check.map((c,i)=>`<label for="sc-${i}"><input type="checkbox" id="sc-${i}" class="sc"> ${c}</label>`).join('')}</div>
    </section>${cta(`<button class="btn btn-primary" data-act="checkdone">${tr('save')}</button>`)}`;
  const A = L().assess[def.assess];
  return `
    <section class="screen">
      <div class="bar"><span class="tag">${tr('rateIt')} · ${bname(b.key)}</span></div>
      <h2>${A.q.replace('{t}', tn)}</h2>
      <div class="choices">${A.o.map(([v,l,s])=>`<button data-act="rate" data-v="${v}">${dot(v==='good'?'lime':v==='partial'?'orange':'red')}<span style="display:grid;color:var(--fg)">${l}<span>${s}</span></span></button>`).join('')}</div>
    </section>`;
}

/* ---------- Reward ---------- */
function vReward(){
  return `
  <section class="screen">
    <div class="bar"><span class="tag">${R.pill?tr('pillDone'):tr('sessDone')}</span><span class="lvl"><b>Lv ${level()}</b></span></div>
    <svg class="done-mark" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28"/><path d="M20 33 l8 8 l16 -18"/></svg>
    <div><div class="xp-big" id="xpbig">${R.xp}</div><span class="tag">${tr('xpEarned',{n:S.xp})}</span></div>
    ${R.mastered.map(n=>`<div class="mastered"><svg viewBox="0 0 112 112"><polygon points="${SPARK}"/></svg><span class="tag">${tr('mastered')}</span><h2>${esc(n)}</h2></div>`).join('')}
    ${R.changes.length?`<div class="changes">${R.changes.map(c=>`<div class="change"><span class="nm">${esc(c.name)}${c.note?`<br><span class="tag">${c.note}</span>`:''}</span><span class="arr">${dot(c.from)}${c.from!==c.to?`→ ${dot(c.to)}`:''}</span></div>`).join('')}</div>`:''}
    <div class="stats3">
      <div class="stat"><b>${R.cards}</b><span>${tr('cards')}</span></div>
      <div class="stat"><b>×${R.best}</b><span>${tr('bestCombo')}</span></div>
      <div class="stat hot"><b>${streak()}</b><span>${tr('streak')}</span></div>
    </div>
    ${xpHeader()}
  </section>${cta(`<button class="btn btn-primary" data-act="today">${tr('cont')}</button>${R.gap&&topic(R.gap)?`<button class="btn btn-ghost" data-act="maker">${tr('gaps')}</button>`:''}`)}`;
}

function vMaker(){
  const t = topic(R.gap);
  return `<section class="screen">
    <div class="bar"><button class="back" data-act="today" aria-label="${tr('back')}">←</button><span class="tag">${tr('fixGaps')}</span></div>
    <h2>${esc(t?.name)}</h2>${t?vMakerBody(t.id):''}
  </section>${cta(`<button class="btn btn-primary" data-act="today">${tr('saveCont')}</button>`)}`;
}

function vPill(){
  const head = `<div class="bar"><button class="back" data-act="today" aria-label="${tr('back')}">←</button><span class="tag">${tr('pillTag')}</span></div>`;
  if(CR) return `<section class="screen">${head}<h2>${tr('quickHit')}</h2>${vDeck()}</section>${cta(deckCta())}`;
  const w = byPriority(S.topics)[0];
  if(!w) return `<section class="screen">${head}<h2>${tr('addFirstH')}</h2><p class="lead">${tr('addFirstP')}</p></section>
    ${cta(`<button class="btn btn-primary" data-act="gotopics">${tr('goTopics')}</button>`)}`;
  return `<section class="screen">${head}
    <h2>${tr('threeFacts',{t:esc(w.name)})}</h2>
    <p class="lead">${tr('threeLead')}</p>
    <div class="choices">
      <button data-act="pillrate" data-id="${w.id}" data-v="good">${dot('lime')}<span style="display:grid">${tr('got3')}</span></button>
      <button data-act="pillrate" data-id="${w.id}" data-v="partial">${dot('orange')}<span style="display:grid">${tr('got12')}</span></button>
      <button data-act="pillrate" data-id="${w.id}" data-v="bad">${dot('red')}<span style="display:grid">${tr('got0')}</span></button>
    </div>
  </section>`;
}

/* ---------- Timer ---------- */
function tick(){
  T.left = Math.max(0, T.left - (T.fast?30:1));
  const t=document.getElementById('time'); if(t) t.textContent = clock(T.left);
  const e=document.getElementById('elapsed'); if(e) e.textContent = clock(T.total-T.left);
  const bar=document.getElementById('tbar'); if(bar) bar.style.width = ((T.total-T.left)/T.total*100)+'%';
  if(T.left===0){ stopT(); toast(tr('timeUp')); buzz(60); if(B[curBlock().key].mode==='focus') toAssess(); }
}
function startT(){ if(T.run) return; T.run=true; T.h=setInterval(tick,1000); syncT(); }
function stopT(){ T.run=false; clearInterval(T.h); syncT(); }
function syncT(){
  const o=document.getElementById('orb'); if(o) o.className='s-orb '+(T.run?'running':'paused');
  const p=document.getElementById('playbtn'); if(p){ p.innerHTML=T.run?pauseIco:playIco; p.setAttribute('aria-label',T.run?tr('pause'):tr('play')); }
}
function toAssess(){
  stopT();
  const def = B[curBlock().key];
  if(def.assess==='none') completeSession(30); else go('assess');
}

/* ---------- Motion (anime.js v4) ---------- */
const FX = () => !!window.anime && !matchMedia('(prefers-reduced-motion: reduce)').matches;
let lastScene = '';
let busy = false;
let morphing = false;
function riseChars(el, delay=0, step=14){
  if(!el) return;
  const { chars } = anime.splitText(el, { chars: { wrap: 'clip' } });
  return anime.animate(chars, { y: ['110%','0%'], duration: 700, ease: 'out(4)', delay: anime.stagger(step, {start: delay}) });
}
function riseWords(el, delay=0){
  if(!el) return;
  const { words } = anime.splitText(el, { words: { wrap: 'clip' } });
  return anime.animate(words, { y: ['110%','0%'], duration: 800, ease: 'out(4)', delay: anime.stagger(55, {start: delay}) });
}
function fadeUp(sel, start=0, step=60, dist=18){
  const els = document.querySelectorAll(sel); if(!els.length) return;
  anime.animate(els, { opacity: [0,1], y: [dist,0], duration: 600, ease: 'out(3)', delay: anime.stagger(step, {start}) });
}
function countUp(el, to, ms=900){
  if(!el) return;
  const t0 = performance.now();
  const f = now => { const k = Math.min(1,(now-t0)/ms); el.textContent = Math.round(to*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(f); };
  el.textContent = '0'; requestAnimationFrame(f);
}
function popCard(){ if(FX()) anime.animate('#fcard', { opacity:[0,1], y:[18,0], scale:[.97,1], duration:380, ease:'out(3)' }); }
function starPoints(){
  const u = anime.utils, total = u.random(4, 40), r1 = u.random(8, 50), r2 = 56;
  const l = total % 2 ? total + 1 : total; let pts = '';
  for(let i=0;i<l;i++){ const r = i%2 ? r1 : r2; const a = (2*Math.PI*i/l) - Math.PI/2;
    pts += `${56 + u.round(r*Math.cos(a),0)},${56 + u.round(r*Math.sin(a),0)} `; }
  return pts;
}
function morphLoop(){
  const a = document.getElementById('morph-a'), b = document.getElementById('morph-b');
  if(!a || !b || !morphing) return;
  anime.utils.set(b, { points: starPoints() });
  anime.animate(a, { points: anime.svg.morphTo(b), ease: 'inOutCirc', duration: 420, onComplete: morphLoop });
}
function morphSettle(){
  morphing = false;
  const a = document.getElementById('morph-a'), b = document.getElementById('morph-b');
  if(!a || !b || !FX()) return;
  anime.utils.set(b, { points: SPARK });
  anime.animate(a, { points: anime.svg.morphTo(b), ease: 'out(4)', duration: 700 });
  anime.animate('.morph', { rotate: [0, 90], scale: [1, 1.12, 1], duration: 900, ease: 'inOut(3)' });
}
function quizOut(next, dir){
  if(!FX() || busy){ next(); return; }
  busy = true;
  const targets = [document.querySelector('.screen h2'), ...document.querySelectorAll('.opt')].filter(Boolean);
  anime.animate(targets, { opacity: [1,0], y: [0, dir>0 ? -14 : 14], duration: 260, ease: 'in(2)', delay: anime.stagger(25),
    onComplete: () => { busy = false; next(); } });
}
function animateScene(){
  if(!FX()) return;
  const scene = S.screen + (S.screen==='quiz' ? S.qi : S.screen==='today' ? S.day+S.view : S.screen==='session' ? sKey() : '');
  if(scene === lastScene) return;
  lastScene = scene;
  try{
    if(S.screen==='welcome'){ riseWords(document.querySelector('h1'), 150); fadeUp('.lead', 600); fadeUp('.steps-mini div', 800, 90); }
    if(S.screen==='quiz'){ riseChars(document.querySelector('.screen h2'), 0, 12); fadeUp('.opt', 220, 70, 22); }
    if(S.screen==='building'){
      anime.animate('.build-orb', { scale: [0.2,1], opacity: [0,1], duration: 900, ease: 'out(4)' });
      anime.animate('.morph', { scale: [0,1], duration: 700, ease: 'out(4)' });
      morphing = true; morphLoop();
    }
    if(S.screen==='reveal'){
      const big = document.querySelector('.count .big'); if(big) countUp(big, +big.textContent);
      fadeUp('.why div', 500, 110, 12); fadeUp('.day', 900, 90, 24);
    }
    if(S.screen==='today'){ fadeUp('.stat', 0, 60, 10); fadeUp('.pillcard', 80, 60, 10); fadeUp('.row, .topic', 160, 40, 12); }
    if(S.screen==='session'){ if(document.querySelector('.s-orb')) anime.animate('.s-orb', { scale: [0.6,1], opacity: [0,1], duration: 900, ease: 'out(4)' }); fadeUp('.howto li', 300, 80, 10); popCard(); }
    if(S.screen==='assess'){ riseChars(document.querySelector('h2'), 0, 14); fadeUp('.choices button, .checklist label', 250, 60); }
    if(S.screen==='reward'){
      anime.animate(anime.svg.createDrawable('.done-mark circle'), { draw: ['0 0','0 1'], duration: 700, ease: 'inOut(3)' });
      anime.animate(anime.svg.createDrawable('.done-mark path'), { draw: ['0 0','0 1'], duration: 450, delay: 550, ease: 'out(3)' });
      countUp(document.getElementById('xpbig'), R.xp, 1100);
      anime.animate('.mastered', { scale: [.6,1], opacity: [0,1], duration: 900, delay: 500, ease: 'out(4)' });
      anime.animate('.mastered svg', { rotate: [0, 180], scale: [0, 1.2, 1], duration: 1200, delay: 600, ease: 'out(4)' });
      fadeUp('.change', 700, 90, 12); fadeUp('.stats3 .stat', 900, 70, 10);
    }
    if(S.screen==='pill'){ popCard(); fadeUp('.choices button', 200, 60); }
  }catch(e){}
}

/* ---------- Persistence ---------- */
const KEY='crux-alpha-v1';
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function restore(){
  try{
    const r = JSON.parse(localStorage.getItem(KEY)||'null');
    if(!r || !r.plan) return;
    S = Object.assign(fresh(), r);
    if(['session','assess','reward','pill','maker','building'].includes(S.screen)) S.screen='today';
    const st = new Date(S.start || Date.now()); st.setHours(0,0,0,0);
    const now = new Date(); now.setHours(0,0,0,0);
    S.day = Math.min(Math.max(0, Math.round((now-st)/864e5)), S.plan.length-1);
  }catch(e){}
}

function render(){
  const v = {welcome:vWelcome,quiz:vQuiz,building:vBuilding,reveal:vReveal,save:vSave,today:vToday,session:vSession,assess:vAssess,reward:vReward,maker:vMaker,pill:vPill}[S.screen]();
  document.getElementById('app').innerHTML = v;
  persist();
  if(S.screen==='session'){
    const bar=document.getElementById('tbar'); if(bar) bar.style.width=((T.total-T.left)/T.total*100)+'%';
    const f=document.getElementById('fast'); if(f) f.onchange=()=>{T.fast=f.checked;};
    const sel=document.getElementById('sel-topic'); if(sel) sel.onchange=()=>{ S.sessTopic[sKey()] = sel.value; render(); };
  }
  animateScene();
}

/* ---------- Actions ---------- */
function addTopic(){
  const i = document.getElementById('tp-in'); const name = i && i.value.trim(); if(!name) return;
  S.topics.push({id:uid(), name, status:'red', star:false, hits:[]});
  buzz(6); render(); const n = document.getElementById('tp-in'); if(n) n.focus();
}
function addCard(tid){
  const q = document.getElementById('cq'), a = document.getElementById('ca');
  if(!q || !a || !q.value.trim() || !a.value.trim()){ toast(tr('fillBoth')); return; }
  S.cards.push({id:uid(), tid, q:q.value.trim(), a:a.value.trim(), box:1, due:S.day, got:0, miss:0});
  addXP(5); buzz(6); render(); const n = document.getElementById('cq'); if(n) n.focus();
}

document.addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  if(e.target.id==='tp-in'){ e.preventDefault(); addTopic(); }
  if(e.target.id==='cq'){ e.preventDefault(); const a=document.getElementById('ca'); if(a) a.focus(); }
  if(e.target.id==='ca'){ e.preventDefault(); addCard(S.screen==='maker' ? R.gap : curTopicId()); }
});

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const act = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  if(act==='start'){ S.qi=0; go('quiz'); }
  else if(act==='pick'){
    S.a[QZ()[S.qi].k]=v; persist();
    document.querySelectorAll('.opt').forEach(o=>o.setAttribute('aria-pressed', o.dataset.v===v));
    const nb=document.querySelector('[data-act="qnext"]'); if(nb) nb.disabled=false;
    if(FX()) anime.animate(el.querySelector('.dot'),{scale:[0.4,1.25,1],duration:420,ease:'out(3)'});
  }
  else if(act==='qback'){ quizOut(()=>{ if(S.qi===0) go('welcome'); else { S.qi--; render(); } }, -1); }
  else if(act==='qnext'){
    if(S.qi<QZ().length-1){ quizOut(()=>{ S.qi++; render(); }, 1); }
    else {
      const keep = {topics:S.topics, cards:S.cards, xp:S.xp, active:S.active, lang:S.lang};
      S = Object.assign(fresh(), {a:S.a}, keep);
      S.plan = buildPlan(S.a); S.start = new Date().toISOString();
      go('building');
      const lines=L().building;
      lines.forEach((l,i)=>setTimeout(()=>{ const b=document.getElementById('bline'); if(!b) return; b.textContent=l; if(FX()) riseChars(b, 0, 10); if(i===lines.length-1) morphSettle(); },i*900));
      setTimeout(()=>{ morphing=false; go('reveal'); }, lines.length*900 + 300);
    }
  }
  else if(act==='save') go('save');
  else if(act==='toReveal') go('reveal');
  else if(act==='today'){ stopT(); go('today'); }
  else if(act==='restart'){ try{localStorage.removeItem(KEY)}catch(err){} const lg=S.lang; S=fresh(); S.lang=lg; lastScene=''; render(); }
  else if(act==='lang'){ S.lang = S.lang==='pt' ? 'en' : 'pt'; document.documentElement.lang = S.lang; lastScene=''; render(); }
  else if(act==='day'){ S.day=+v; render(); }
  else if(act==='view'){ S.view=v; render(); }
  else if(act==='gotopics'){ S.view='topics'; go('today'); }
  else if(act==='open') openSession(+v);
  else if(act==='toggle'){ T.run?stopT():startT(); }
  else if(act==='reset'){ stopT(); T.left=T.total; render(); }
  else if(act==='exit'){ stopT(); go('today'); }
  else if(act==='finish') toAssess();
  else if(act==='tadd') addTopic();
  else if(act==='tset'){ const t=topic(id); if(t){ t.status=v; buzz(6); render(); } }
  else if(act==='tstar'){ const t=topic(id); if(t){ t.star=!t.star; buzz(6); render(); } }
  else if(act==='tdel'){ S.topics=S.topics.filter(t=>t.id!==id); S.cards=S.cards.filter(c=>c.tid!==id); render(); }
  else if(act==='triagedone'){ addXP(5*S.topics.length); completeSession(30); }
  else if(act==='addcard') addCard(S.screen==='maker' ? R.gap : curTopicId());
  else if(act==='testcards'){ const ids = S.cards.filter(c=>c.tid===curTopicId()).map(c=>c.id); startDeck(ids,'session',curTopicId()); CP='test'; render(); popCard(); }
  else if(act==='flip'){ CR.flip=true; render(); if(FX()) anime.animate('#ans',{opacity:[0,1],y:[10,0],duration:300,ease:'out(3)'}); }
  else if(act==='grade') gradeCard(v);
  else if(act==='reviewdone') completeSession(15);
  else if(act==='rate'){ const tid=curTopicId(); if(tid) applyResult(tid, v); completeSession(30); }
  else if(act==='checkdone'){
    const misses = document.querySelectorAll('.sc:not(:checked)').length;
    const tid = curTopicId(); if(tid) applyResult(tid, misses<=1 ? 'good' : misses<=3 ? 'partial' : 'bad');
    completeSession(30);
  }
  else if(act==='maker') go('maker');
  else if(act==='pill') startPill();
  else if(act==='pillrate'){ applyResult(id, v); finishPill(); }
});

restore();
document.documentElement.lang = S.lang;
render();
</script>
